<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時計と天気</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="time-section">
                <div id="date" class="date"></div>
                <div id="time" class="time"></div>
            </div>

            <div class="weather">
                <div class="current-weather">
                    <span id="weather-icon" class="weather-icon"></span>
                    <div class="temp-info">
                        <span id="temperature" class="temperature">--°</span>
                        <span id="feels-like" class="feels-like">体感 --°</span>
                    </div>
                </div>

                <div id="hourly-forecast" class="hourly-forecast">
                </div>
            </div>

            <div class="daily-forecast">
                <div id="daily-forecast" class="daily-items">
                </div>
            </div>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
